name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Honors rust-toolchain.toml (its channel, rustfmt and clippy).
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: tests (lib, compile-fail, integration with Docker)
    runs-on: ubuntu-latest
    # ubuntu-latest runners ship a running Docker daemon; the integration test
    # pulls the surrealdb/surrealdb image tag in config/default.toml and manages
    # its own container via bollard.
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --lib
        run: cargo test --lib -- --test-threads=1
      - name: cargo test --test compile_fail
        run: cargo test --test compile_fail
      - name: cargo test
        run: cargo test --test integration_test
