[package]
name = "surrealdb_live_message"
version = "0.6.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.54.1", features = ["full", "macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["rt"] }
surrealdb = { version = "3.3.5", features = ["kv-mem"] }
surrealdb-types = "3.3.5"
futures = "0.3.34"
async-channel = "2.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
config = "0.15.27"
bollard = "0.21.1"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "gzip",
] }

[dev-dependencies]
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio-graceful-shutdown = "0.20.0"
